name: rag-eval

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # rag.evaluate เขียนตารางผลลงไฟล์ $GITHUB_STEP_SUMMARY เอง จึงขึ้นใน Job Summary
      - name: Evaluate retrieval (dev split)
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9

      - name: Evaluate retrieval (dev split, hybrid)
        run: python -m rag.evaluate --split dev --method hybrid -k 4 --min-hit 0.9
